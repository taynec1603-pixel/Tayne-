<title>Tayne’s Movie Generator</title>

<style>
/* Layout: one centred column — marquee sign, controls strip, admission-ticket result. Single dark "cinema" look by choice. */
:root {
  --velvet: #1a0b12;
  --velvet-2: #2a1220;
  --curtain: #5c1530;
  --bulb: #f6be4a;
  --bulb-dim: #7a5a22;
  --paper: #f7ecd6;
  --ink: #2b1a14;
  --text: #f3e6d8;
  --muted: #c4a9a0;
  --line: #4a2234;
  --f-display: "Limelight", "Didot", Georgia, serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "DM Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--velvet); }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(120% 60% at 50% 0%, var(--velvet-2), var(--velvet) 70%),
    var(--velvet);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 28px; }

/* Marquee sign */
.marquee {
  position: relative;
  padding: 26px 22px 22px;
  border-radius: 14px;
  background: var(--curtain);
  text-align: center;
  box-shadow: 0 0 0 2px var(--bulb-dim) inset, 0 18px 40px -20px #000;
}
.bulbs {
  position: absolute; inset: 7px; border-radius: 10px; pointer-events: none;
  background:
    radial-gradient(circle, var(--bulb) 0 2.4px, transparent 3px) 0 0 / 18px 18px repeat-x,
    radial-gradient(circle, var(--bulb) 0 2.4px, transparent 3px) 0 100% / 18px 18px repeat-x;
  height: auto;
  animation: chase 1.2s steps(2) infinite;
}
@keyframes chase { 50% { background-position: 9px 0, 9px 100%; } }
.marquee .eyebrow {
  font-family: var(--f-mono); font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
  color: var(--bulb); margin: 6px 0 4px;
}
h1 {
  font-family: var(--f-display); font-weight: 400; margin: 0;
  font-size: clamp(30px, 8vw, 46px); line-height: 1.08; color: var(--paper);
  text-wrap: balance; text-shadow: 0 0 18px rgba(246,190,74,.35);
}
.marquee p.sub { margin: 10px 0 4px; color: var(--muted); font-size: 15px; }

/* Controls */
.controls { display: grid; gap: 18px; }
.label {
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  font-weight: 600; margin-bottom: 8px; display: block;
}
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--velvet-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.seg button {
  font: 600 16px var(--f-body); color: var(--muted); background: transparent; border: 0;
  padding: 11px 10px; border-radius: 999px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--bulb); color: var(--ink); }
select {
  width: 100%; font: 600 16px var(--f-body); color: var(--text);
  background: var(--velvet-2); border: 1px solid var(--line); border-radius: 12px;
  padding: 13px 44px 13px 14px; appearance: none; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--bulb) 50%), linear-gradient(135deg, var(--bulb) 50%, transparent 50%);
  background-position: calc(100% - 22px) 55%, calc(100% - 16px) 55%;
  background-size: 6px 6px; background-repeat: no-repeat;
}
.spin {
  font: 800 18px var(--f-body); letter-spacing: .04em;
  background: var(--bulb); color: var(--ink); border: 0; border-radius: 14px;
  padding: 16px; cursor: pointer; box-shadow: 0 6px 0 var(--bulb-dim);
  transition: transform .08s, box-shadow .08s;
}
.spin:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--bulb-dim); }
button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
.pool { font-size: 13px; color: var(--muted); text-align: center; margin: -6px 0 0; }

/* Ticket */
.ticket {
  position: relative; background: var(--paper); color: var(--ink);
  border-radius: 12px; display: grid; grid-template-columns: 1fr auto;
  -webkit-mask: radial-gradient(circle 12px at 0 50%, transparent 98%, #000) left / 51% 100% no-repeat,
                radial-gradient(circle 12px at 100% 50%, transparent 98%, #000) right / 51% 100% no-repeat;
          mask: radial-gradient(circle 12px at 0 50%, transparent 98%, #000) left / 51% 100% no-repeat,
                radial-gradient(circle 12px at 100% 50%, transparent 98%, #000) right / 51% 100% no-repeat;
}
.ticket.flip { animation: flip .45s ease-out; }
@keyframes flip { from { transform: rotateX(70deg); opacity: .2; } to { transform: none; opacity: 1; } }
.t-main { padding: 22px 20px 20px 26px; min-width: 0; display: grid; gap: 8px; }
.t-kind { font-family: var(--f-mono); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--curtain); }
.t-title { font-family: var(--f-display); font-size: clamp(24px, 6.5vw, 34px); line-height: 1.1; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.t-year { font-family: var(--f-mono); font-size: 14px; color: #6b5146; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid #cdb79a; color: #5a3f33; }
.chip.on { background: var(--curtain); border-color: var(--curtain); color: var(--paper); }
.links { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; }
.links a { color: var(--curtain); font-weight: 600; font-size: 14px; text-underline-offset: 3px; }
.t-stub {
  border-left: 2px dashed #cdb79a; padding: 22px 24px 20px 18px;
  display: grid; align-content: center; justify-items: center; gap: 2px; text-align: center;
}
.t-stub .score { font-family: var(--f-mono); font-size: 34px; line-height: 1; color: var(--curtain); font-variant-numeric: tabular-nums; }
.t-stub .of { font-family: var(--f-mono); font-size: 12px; color: #6b5146; }
.t-stub .star { color: #c58b12; font-size: 18px; }
.empty { padding: 26px; text-align: center; color: #5a3f33; grid-column: 1 / -1; }
.note { font-size: 13px; color: var(--muted); text-align: center; max-width: 46ch; margin: 0 auto; }

@media (max-width: 380px) {
  .ticket { grid-template-columns: 1fr; }
  .t-stub { border-left: 0; border-top: 2px dashed #cdb79a; grid-auto-flow: column; gap: 8px; padding: 12px 20px 16px; }
}
@media (prefers-reduced-motion: reduce) {
  .bulbs, .ticket.flip { animation: none; }
}
</style>
</head>

<div class="wrap">
  <header class="marquee">
    <div class="bulbs" aria-hidden="true"></div>
    <div class="eyebrow">Now showing</div>
    <h1>Tayne’s Movie Generator</h1>
    <p class="sub">Pick movie or series, choose a genre and year, and let the projector decide. Every pick is rated above 7.</p>
  </header>

  <section class="controls" aria-label="Choose what to watch">
    <div>
      <span class="label" id="kind-label">I want to watch a</span>
      <div class="seg" role="group" aria-labelledby="kind-label">
        <button type="button" id="btn-movie" data-kind="movie" aria-pressed="true">Movie</button>
        <button type="button" id="btn-series" data-kind="series" aria-pressed="false">Series</button>
      </div>
    </div>
    <div>
      <label class="label" for="genre">Genre</label>
      <select id="genre"></select>
    </div>
    <div>
      <label class="label" for="decade">Released from</label>
      <select id="decade"></select>
    </div>
    <button type="button" class="spin" id="spin">🎬 Pick something for me</button>
    <p class="pool" id="pool"></p>
  </section>

  <article class="ticket" id="ticket" aria-live="polite"></article>

  <p class="note">Genres follow Flixtor’s genre list. Ratings are IMDb scores, the same ones Flixtor displays, and may shift slightly over time.</p>
</div>

const toObj = kind => r => ({ kind, title: r[0], year: r[1], rating: r[2], genres: r[3].split("|") });
const DATA = { movie: MOVIES.map(toObj("movie")), series: SERIES.map(toObj("series")) };

let kind = "movie";
let lastTitle = null;
const $ = id => document.getElementById(id);
const genreSel = $("genre"), decadeSel = $("decade"), ticket = $("ticket"), poolEl = $("pool");

function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

function pool() {
  const g = genreSel.value, d = decadeSel.value;
  return DATA[kind].filter(t => t.rating > 7 && (g === "Any" || t.genres.includes(g)) && (d === "Any" || t.year >= Number(d)));
}

// Every year from the newest title back to the oldest, for this type
function fillDecades() {
  const prev = decadeSel.value || load("tmg-from") || "Any";
  const years = DATA[kind].filter(t => t.rating > 7).map(t => t.year);
  const opts = [["Any", "Any year"]];
  for (let y = Math.max(...years); y >= Math.min(...years); y--) opts.push([String(y), `${y} onwards`]);
  decadeSel.innerHTML = "";
  opts.forEach(([v, label]) => { const o = document.createElement("option"); o.value = v; o.textContent = label; decadeSel.appendChild(o); });
  decadeSel.value = opts.some(o => o[0] === prev) ? prev : "Any";
}

function fillGenres() {
  const prev = genreSel.value || load("tmg-genre") || "Any";
  const avail = GENRES.filter(g => DATA[kind].some(t => t.rating > 7 && t.genres.includes(g)));
  genreSel.innerHTML = "";
  [["Any", "Any genre"], ...avail.map(g => [g, g])].forEach(([v, label]) => {
    const o = document.createElement("option");
    o.value = v; o.textContent = label;
    genreSel.appendChild(o);
  });
  genreSel.value = avail.includes(prev) ? prev : "Any";
  updatePool();
}

function updatePool() {
  const n = pool().length;
  const noun = kind === "movie" ? (n === 1 ? "movie" : "movies") : "series";
  poolEl.textContent = `${n} ${noun} rated above 7 match your choices`;
}

function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

function render(t) {
  ticket.classList.remove("flip"); void ticket.offsetWidth; ticket.classList.add("flip");
  if (!t) {
    ticket.innerHTML = `<div class="empty">No ${kind === "movie" ? "movies" : "series"} rated above 7 match this genre and year. Try another genre or year.</div>`;
    return;
  }
  const g = genreSel.value;
  const q = encodeURIComponent(`${t.title} ${t.year}`);
  ticket.innerHTML = `
    <div class="t-main">
      <div class="t-kind">Admit one · ${t.kind === "movie" ? "Movie" : "Series"}</div>
      <h2 class="t-title">${esc(t.title)}</h2>
      <div class="t-year">${t.kind === "series" ? "First aired " : ""}${t.year}</div>
      <div class="chips">${t.genres.map(x => `<span class="chip${x === g ? " on" : ""}">${x}</span>`).join("")}</div>
      <div class="links">
        <a href="https://www.imdb.com/find/?q=${q}" target="_blank" rel="noopener">IMDb page</a>
        <a href="https://www.youtube.com/results?search_query=${q}%20trailer" target="_blank" rel="noopener">Watch trailer</a>
      </div>
    </div>
    <div class="t-stub" aria-label="Rated ${t.rating} out of 10">
      <span class="star" aria-hidden="true">★</span>
      <span class="score">${t.rating.toFixed(1)}</span>
      <span class="of">/ 10</span>
    </div>`;
}

function spin() {
  const p = pool();
  let choices = p.length > 1 ? p.filter(t => t.title !== lastTitle) : p;
  const pick = choices[Math.floor(Math.random() * choices.length)] || null;
  lastTitle = pick ? pick.title : null;
  render(pick);
}

function setKind(k) {
  kind = k;
  store("tmg-kind", k);
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.kind === k)));
  fillDecades();
  fillGenres();
  spin();
}

document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setKind(b.dataset.kind)));
genreSel.addEventListener("change", () => { store("tmg-genre", genreSel.value); updatePool(); spin(); });
decadeSel.addEventListener("change", () => { store("tmg-from", decadeSel.value); updatePool(); spin(); });
$("spin").addEventListener("click", spin);

setKind(load("tmg-kind") === "series" ? "series" : "movie");
</script>
